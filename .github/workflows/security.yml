name: security

# Secrets, vulnerable dependencies, and new advisories against what already
# shipped. Runs on every pull request, on main, and weekly.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The open-source gitleaks CLI (MIT), at the version pre-commit runs. The
      # gitleaks-action wrapper needs a paid licence for organisation repositories.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

  dependency-review:
    name: Dependency review
    # Needs the repository's Dependency graph turned on. Off until an admin
    # enables it and sets the repository variable DEPENDENCY_REVIEW to "true";
    # Dependency audit below covers known advisories meanwhile.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Blocks a pull request that adds a dependency with a high or critical
      # advisory, or a licence that is not allowed below.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # What ships: the server's and web's runtime dependencies.
      - name: npm audit (runtime)
        run: npm audit --omit=dev --audit-level=high
      # The agent's declared dependencies, resolved fresh (not the runner's site-packages).
      - name: pip-audit (agent)
        run: |
          pip install "pip-audit==2.9.0"
          pip-audit ./agent
