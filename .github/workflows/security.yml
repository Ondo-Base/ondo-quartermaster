name: security

# Secrets, vulnerable dependencies, and new advisories against what already
# shipped. Runs on every pull request, on main, and weekly.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    # Needs the repository's Dependency graph turned on. Off until an admin
    # enables it and sets the repository variable DEPENDENCY_REVIEW to "true";
    # Dependency audit below covers known advisories meanwhile.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Blocks a pull request that adds a dependency with a high or critical
      # advisory, or a licence that is not allowed below.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # What ships: the server's and web's runtime dependencies.
      - name: npm audit (runtime)
        run: npm audit --omit=dev --audit-level=high
      # The agent's declared dependencies, resolved fresh (not the runner's site-packages).
      - name: pip-audit (agent)
        run: |
          pip install "pip-audit==2.9.0"
          pip-audit ./agent
