# Ondo agent configuration. Everything that must hold lives here, enforced by the
# harness, never in prompt text. Copy to ondo.yaml and adjust.

agent:
  runs_dir: .ondo/runs
  decision_labels: .ondo/decisions.jsonl
  consents_file: .ondo/consents.json   # connectors allowed on this device, when no control plane is attached
  # Set by device management instead (docs/deploy-windows.md): control_plane, enrollment_token.

models:
  profiles_file: config/profiles.yaml
  # OpenRouter for now; set ONDO_MODEL_PROFILE=demo for the scripted stand-in
  # that needs no key, or =gateway once a LiteLLM is in front.
  orchestrator: ${ONDO_MODEL_PROFILE:-openrouter}
  fallbacks: [openrouter-fast]

# The user's grants on this device. When connected, the control plane sends these.
grants:
  files:
    granted: true
    folders: ["demo/Northwind client drive"]
  screen:
    granted: false
  input:
    granted: true   # the browser acts on the user's behalf, so it needs this grant

# Set by the administrator. Not grantable by the user.
policy:
  excluded_paths: ["**/HR/**", "**/*payroll*", "**/*password*"]
  excluded_windows: ["Personal mail", "HR portal", "Password manager"]
  writes_require_approval: true
  # Connectors people may allow. With a control plane, the organisation's policy
  # replaces this list.
  allowed_connectors: [ticketing, mail, calendar, documents, ledger]

# Connectors, reached over MCP. Each one is allowed by the person on its first use
# (and only if policy lists it); every change it makes stops for approval.
connectors:
  # Addresses outside this domain are flagged in approvals.
  org_domain: northwind-ops.com
  ticketing:
    # The sample service desk (demo/ticketing_server.py). A real one is its MCP server:
    # command: [...] for a local server, or url: https://... (streamable HTTP) with
    # token_env naming the environment variable that holds its bearer token.
    command: ["{python}", -m, ondo_agent.demo.ticketing_server, --store, .ondo/tickets.json]
  # The sample mailbox, calendar and team sites (demo/workplace_servers.py).
  mail:
    command: ["{python}", -m, ondo_agent.demo.workplace_servers, --connector, mail, --store, .ondo/mail.json]
  calendar:
    command: ["{python}", -m, ondo_agent.demo.workplace_servers, --connector, calendar, --store, .ondo/calendar.json]
  documents:
    command: ["{python}", -m, ondo_agent.demo.workplace_servers, --connector, documents, --store, .ondo/documents.json]
  # The sample finance system: a reconciliation runs for a while on its side, and
  # the agent waits for it by its handle (poll_seconds, max_wait_hours).
  ledger:
    command: ["{python}", -m, ondo_agent.demo.workplace_servers, --connector, ledger, --store, .ondo/ledger.json]
    poll_seconds: 5
    max_wait_hours: 8
  # Any other MCP server: declare each tool's effect, or it is not offered.
  # billing:
  #   url: https://mcp.billing.internal/mcp
  #   token_env: BILLING_MCP_TOKEN
  #   tools:
  #     list_invoices: {effect: read}
  #     approve_invoice: {effect: move_money, title: "Approved an invoice"}

decision:
  provider: rules          # rules | jev (see decision/jev.py before enabling)

screening:
  enabled: true
  threshold: 0.5

gates:
  thresholds_file: config/thresholds.json
  rules:
    - {effect: submits_to_system_of_record, action: require, name: legacy-billing-submit,
       app: "Legacy billing", element: '^push button "Submit"'}
    - {effect: submits_to_system_of_record, action: require, name: billing-portal-submit,
       url: "http://127.0.0.1:8765/*", element: '^button "(Submit|Save)'}
    - {effect: overwrites_shared_file, action: require, name: shared-drives, path: "**/shares/**"}

browser:
  enabled: true
  headless: true
  allowed_origins: ["http://127.0.0.1:8765"]
  blocked_origins: []
  profile_dir: .ondo/browser-profile
  executable_path: ${ONDO_CHROMIUM:-}
  no_sandbox: false

desktop:
  enabled: false            # semantic desktop control (Stage 4): needs the screen and input grants
  backend: auto             # atspi (Linux) | uia (Windows) | ax (macOS)
  escape_twice: true        # if the key listener cannot start, input control is switched off
  element_pick_threshold: 0.35
  profiles:                 # per-app names for controls the app leaves unnamed
    "Legacy billing": {"push button#1": "Refresh"}

screen:
  enabled: false            # pixels (Stage 5): screenshots, pointer and keyboard; needs desktop.enabled
  backend: auto             # x11 (Linux) | win32 (Windows) | quartz (macOS)
  max_long_edge: 1280       # screenshots are sent no larger; the model profile can lower it
  watch: true               # report which shared window is in front, for "Ask about this screen"
  # Windows where pixels are the only rung, so the accessibility tree need not be
  # read first. Everything else must be inspected before screen_act will act.
  pixel_only_windows: ["*citrix*", "*wfica*", "*remote desktop*", "*mstsc*", "*vnc*", "*remmina*", "*freerdp*"]
  ocr:
    tesseract: tesseract    # local OCR for text-only models and the OCR grounder
  grounding:
    provider: ocr           # ocr (local, CPU) | vision | none
    # A self-hosted grounding model keeps screenshots inside your network:
    # provider: vision
    # base_url: http://gpu-box.internal:8000/v1   # vLLM serving UI-TARS or OS-Atlas
    # model: ui-tars-1.5-7b
    # coords: absolute      # UI-TARS-1.5 and Qwen2.5-VL: absolute; UI-TARS 1.0, OS-Atlas: relative_1000

budget:
  max_steps: 40
  max_tokens: 1000000
