[project]
name = "ondo-agent"
version = "0.1.0"
description = "Ondo Quartermaster desktop agent: harness, model layer, decision layer, tools and permission broker."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "websockets>=13",
  "pyyaml>=6",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "pypdf>=5",
  "mcp>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Semantic desktop control. On Linux, pyatspi and PyGObject come from the system
# (apt install python3-pyatspi gir1.2-atspi-2.0); create the venv with
# --system-site-packages so the agent can import them.
desktop = [
  "pynput>=1.7",
  # Screenshots (Stage 5). OCR grounding also wants the tesseract binary:
  # apt install tesseract-ocr, brew install tesseract, or the Windows installer.
  "pillow>=10",
  "pywinauto>=0.6.8; sys_platform == 'win32'",
  "psutil>=5.9; sys_platform == 'win32'",
  "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

# The self-hosted decision model, run in the agent (decision.checkpoint). Not needed
# to call a laya-serve (decision.endpoint). Pulls in torch: install a CPU-only
# build first where there is no GPU.
laya = ["laya[onnx]==0.3.22"]

[project.scripts]
ondo-agent = "ondo_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:Atspi.Action.get_action_name is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness (E, F, W, B), modern syntax (UP), import order (I), and bandit's
# security checks (S) — the ones a safe-commit gate should catch.
select = ["E", "F", "W", "B", "UP", "I", "S"]
ignore = [
  "S101",  # assert: used for invariants the type checker cannot see
  "S603",  # subprocess without shell: we never pass shell=True; args are lists
  "S607",  # partial executable paths (xdotool, node): resolved from PATH on purpose
  "E501",  # line length is the formatter's job (ruff format)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
